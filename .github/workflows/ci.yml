name: CI

on:
  push:
  pull_request:

env:
  CORE_REPOSITORY: fomoxa/com.fomoxa.networking
  CORE_COMMIT: 09658b803a874b6e9dcf139f27fa06388dc6cb62

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Committed libraries match the native source
        run: |
          built="$(cat native/fomoxa-rapier/built-from.txt)"
          last="$(git log -1 --format=%H -- native/fomoxa-rapier/src native/fomoxa-rapier/Cargo.toml native/fomoxa-rapier/Cargo.lock native/fomoxa-rapier/build.rs native/fomoxa-rapier/rust-toolchain.toml)"
          if ! git merge-base --is-ancestor "$last" "$built"; then
            echo "native source changed at $last, libraries were built from $built"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_COMMIT }}
          path: core

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet tests
        run: dotnet test tests/Fomoxa.Networking.Rapier.Tests.csproj -c Release -p:Unity=${{ github.workspace }}/core

      - name: build the benchmark
        run: dotnet build bench/Fomoxa.Rapier.Bench.csproj -c Release -p:Unity=${{ github.workspace }}/core
